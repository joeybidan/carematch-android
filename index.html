<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030a14" />
    <link rel="icon" type="image/png" href="/branding/carematch-icon.png" />
    <link rel="preload" as="image" href="/branding/joey-bidan-studios.webp" />
    <title>CareMatch</title>
    <!-- Available before React loads, including offline in the Android APK. -->
    <style>
      html, body { margin: 0; background: #030a14; }
      .studio-intro {
        position: fixed; inset: 0; z-index: 1000; display: grid;
        place-content: center; justify-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: #030a14; color: #c4d9ed; font-family: Arial, sans-serif;
        transition: opacity 240ms ease;
      }
      .studio-intro img { display: block; width: min(82vw, 440px, 64vh); height: auto; }
      .studio-intro p { margin: 16px 0 0; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; }
      .studio-intro__loader {
        width: 88px; height: 2px; margin-top: 22px; overflow: hidden;
        border-radius: 2px; background: #123249;
      }
      .studio-intro__loader::after {
        content: ''; display: block; width: 40%; height: 100%; background: #44e4c0;
        animation: studio-loading 1.2s ease-in-out infinite alternate;
      }
      .studio-intro.is-leaving { opacity: 0; pointer-events: none; }
      @keyframes studio-loading { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
      @media (prefers-reduced-motion: reduce) {
        .studio-intro { transition: none; }
        .studio-intro__loader::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="studio-intro" class="studio-intro" role="status" aria-label="Joey Bidan Studios. Loading CareMatch.">
      <img src="/branding/joey-bidan-studios.webp" alt="Joey Bidan Studios" width="960" height="960" />
      <div class="studio-intro__loader" aria-hidden="true"></div>
      <p>Loading CareMatch</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
